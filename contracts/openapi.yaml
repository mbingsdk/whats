        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: waba_session
      description: >-
        Opaque server-side session. HttpOnly; Secure in production; SameSite=Lax; 12-hour absolute and 30-minute idle
        expiry. No raw session secret in JSON.
    APIKey:
      type: http
      scheme: bearer
      description: Future organization/resource-scoped machine key. Not implemented.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Valid bounded IDs are propagated; missing/invalid values are replaced.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
      description: Must match the host-only waba_csrf cookie; authenticated actions also verify its session-stored digest.
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
      description: Exact configured PUBLIC_ORIGIN. Cross-origin state changes are rejected.
    Revision:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Current resource revision; missing returns 428, stale returns 409.
  responses:
    Health:
      description: Check passed.
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Server correlation ID.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - ok
                  - ready
    Error:
      description: Safe error with no underlying credentials or dependency details.
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Server correlation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    MetaConnection:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, external_id, callback_key, configured_waba_id, graph_version, credential_state, last_sync_at, last_error, created_at]
            properties:
              id:
                type: string
                format: uuid
              external_id:
                type: string
              callback_key:
                type: string
                format: uuid
              configured_waba_id:
                type: string
              graph_version:
                type: string
              credential_state:
                type: string
              last_sync_at:
                type: [string, 'null']
                format: date-time
              last_error:
                type: [string, 'null']
              created_at:
                type: string
                format: date-time
    MetaSync:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, app_id, state, attempt_count, error_code, graph_version, created_at, finished_at]
            properties:
              id:
                type: string
                format: uuid
              app_id:
                type: string
                format: uuid
              state:
                type: string
              attempt_count:
                type: integer
              error_code:
                type: [string, 'null']
              graph_version:
                type: string
              created_at:
                type: string
                format: date-time
              finished_at:
                type: [string, 'null']
                format: date-time
    MetaWABA:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, external_id, name, timezone_id, subscribed, lifecycle, graph_version, synced_at]
            properties:
              id:
                type: string
                format: uuid
              external_id:
                type: string
              name:
                type: string
              timezone_id:
                type: string
              subscribed:
                type: boolean
              lifecycle:
                type: string
              graph_version:
                type: string
              synced_at:
                type: string
                format: date-time
    MetaPhone:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, waba_id, external_id, name, display_number, quality, platform, code_verification_status, lifecycle, graph_version, synced_at]
