                type: string
                format: uuid
              fields:
                type: object
              graph_version:
                type: string
              synced_at:
                type: string
                format: date-time
    MetaEvent:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, app_id, received_at, state, event_class, attempt_count, last_error, request_id, parser_version, processed_at]
            properties:
              id:
                type: string
                format: uuid
              app_id:
                type: string
                format: uuid
              received_at:
                type: string
                format: date-time
              state:
                type: string
              event_class:
                type: string
              attempt_count:
                type: integer
              last_error:
                type: [string, 'null']
              request_id:
                type: string
              parser_version:
                type: integer
              processed_at:
                type: [string, 'null']
                format: date-time
    MetaCommand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        queued:
          type: boolean
        bound:
          type: boolean
        generation:
          type: integer
    MetaHealth:
      type: object
      required: [connections, processing, runtime_configured, scope]
      properties:
        runtime_configured:
          type: boolean
        scope:
          type: string
        connections:
          type: array
          items:
            type: object
            description: App ID, Graph version, credential state, last sync/error, valid challenge time and last authentic webhook time. Provider provenance requires separate live acceptance evidence.
        processing:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
              count:
                type: integer
    MetaDetail:
      type: object
      required: [id, state, generation, payload_retained, attempts, facts]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        generation:
          type: integer
        payload_retained:
          type: boolean
        attempts:
          type: array
          maxItems: 100
          items:
            type: object
            description: generation, attempt_no, result, error_code, parser_version, created_at.
        facts:
          type: array
          maxItems: 100
          items:
            type: object
            description: event_class, internal waba_id and phone_id, uncertain_identity. No message body or customer identity.
    MetaPayload:
      type: object
      description: Structural inspection only. Arbitrary keys, provider strings, contacts, IDs and content are withheld; quarantined and expired evidence is denied. Inspection is audited.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
            field_errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                  code:
                    type: string
    IdentityInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
        code:
          type: string
          writeOnly: true
        token:
          type: string
          writeOnly: true
        name:
          type: string
          maxLength: 100
        organization_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        role_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        permissions:
          type: array
          maxItems: 30
          items:
            type: string
            enum:
              - organization.view
              - members.view
              - members.invite
              - members.manage
              - teams.view
              - teams.manage
              - roles.view
              - roles.manage
              - roles.assign
              - owners.manage
              - audit.view
        scope:
          type: string
          enum:
            - ORG
            - TEAM
            - SELF
        team_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        grants:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - role_id
              - scope
              - team_id
            properties:
              role_id:
                type: string
                format: uuid
              scope:
                type: string
                enum:
                  - ORG
                  - TEAM
                  - SELF
              team_id:
                type:
                  - string
                  - 'null'
                format: uuid
    IdentityResult:
      type: object
      description: >-
        Action-specific response. Opaque session tokens are emitted only in HttpOnly cookies. Access changes invalidate
        affected organization sessions; the acting session rotates when it retains membership. Organization switching
        preserves the original absolute expiry and reauthentication time.
      properties:
        ok:
          type: boolean
        authenticated:
          type: boolean
        csrf_token:
          type: string
        mfa_required:
          type: boolean
        challenge:
          type: string
          description: One-use MFA login proof, five-minute expiry.
        id:
          type: string
          format: uuid
        revision:
          type: integer
        state:
          type: string
        organization_id:
          type: string
          format: uuid
        secret:
          type: string
          description: TOTP seed returned only by enrollment.
        uri:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
          description: Returned only during enrollment/regeneration; never stored cleartext.
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            organization_id:
              anyOf:
                - type: string
                  format: uuid
                - type: 'null'
            email:
              type: string
              format: email
            name:
              type: string
            verified:
              type: boolean
            mfa_enabled:
              type: boolean
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              member_id:
                type: string
                format: uuid
        name:
          type: string
        timezone:
          type: string
        member_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
        result:
          type: object
        scoped_teams:
          type: array
          items:
            type: object
            required:
              - id
              - permissions
            properties:
              id:
                type: string
                format: uuid
              permissions:
                type: array
                items:
                  type: string
    IdentityList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            description: >-
              Resource rows contain only the requested organization's records or the authenticated user's sessions; no
              credential columns.
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
      description: >-
        At most 100 records per page. Follow next_cursor until null; permission and tenant scope are reevaluated on
        every request.
