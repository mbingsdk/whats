openapi: 3.1.0
info:
  title: WABA Control identity and Meta ingestion API
  version: 0.3.0
  description: >-
    Implemented Sprint 0/1 identity and Sprint 2 read-only Meta assets and signed ingestion. No outbound WhatsApp
    messaging endpoints. Cookie mutations require matching Origin, CSRF cookie/header and the session-bound CSRF digest.
    Organization IDs never establish authorization.
  license:
    name: Proprietary
    url: https://choosealicense.com/no-permission/
servers:
  - url: /
security: []
tags:
  - name: Foundation
    description: Local process and required database health.
  - name: Identity
    description: Global company identity and own-session security.
  - name: Organization
    description: Membership-checked, permission-scoped organization operations.
  - name: Meta
    description: Existing assets and authenticated webhook ingestion.
paths:
  /api/v1/meta/connection:
    get:
      operationId: metaGETmetaconnection
      summary: List configured connections
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaConnection'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: metaPOSTmetaconnection
      summary: Bind operator-configured App to the session organization
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.manage
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaCommand'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/sync:
    post:
      operationId: metaPOSTmetasync
      summary: Queue a read-only asset synchronization
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.manage
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaCommand'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/sync-runs:
    get:
      operationId: metaGETmetasyncruns
      summary: List synchronization evidence
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaSync'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/wabas:
    get:
      operationId: metaGETmetawabas
      summary: List synchronized WABAs
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaWABA'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/phone-numbers:
    get:
      operationId: metaGETmetaphonenumbers
      summary: List synchronized phone numbers
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaPhone'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/business-profiles:
    get:
      operationId: metaGETmetabusinessprofiles
      summary: List synchronized business profiles
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaProfile'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/health:
    get:
      operationId: metaGETmetahealth
      summary: Read Meta observations and local processing counts
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: meta.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaHealth'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/webhook-events:
    get:
      operationId: metaGETmetawebhookevents
      summary: List sanitized event diagnostics
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: webhooks.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: Accessible row cursor; up to 100 rows per response.
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaEvent'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/webhook-events/{id}:
    get:
      operationId: metaGETmetawebhookeventsid
      summary: Inspect event attempts and classified facts
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: webhooks.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaDetail'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/webhook-events/{id}/payload:
    get:
      operationId: metaGETmetawebhookeventsidpayload
      summary: Inspect audited redacted envelope structure
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: webhooks.payload.view
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaPayload'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/webhook-events/{id}/replay:
    post:
      operationId: metaPOSTmetawebhookeventsidreplay
      summary: Queue the immutable stored event for replay
      tags: [Meta]
      security:
        - SessionCookie: []
      x-permission: webhooks.replay
      description: Organization is derived from the authenticated session. Mutations require verified email, recent authentication, production MFA, Origin and session-bound CSRF. No outbound Meta operation is performed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Successful operation or durably queued work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaCommand'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta/webhooks/{callback}:
    get:
      operationId: metaWebhookget
      summary: Verify the configured callback
      tags: [Meta]
      security: []
      description: Only subscribe mode, one exact token and one nonempty challenge are accepted. Duplicate or malformed parameters fail closed.
      parameters:
        - name: callback
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exact challenge string.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verification or signature rejected.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Rejected verification, signature, envelope, route, body limit or persistence. No success is returned for failed persistence.
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: metaWebhookpost
      summary: Authenticate and durably ingest an exact-byte envelope
      tags: [Meta]
      security: []
      description: App Secret HMAC-SHA256 is verified before JSON parsing and persistence. Raw encrypted evidence and transport dedupe commit before 200. Unknown asset bindings are quarantined. No unsigned mode. Application body cap is the lower of configured HTTP limit and 4 MiB.
      parameters:
        - name: callback
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            pattern: '^sha256=[0-9a-fA-F]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object, entry]
              properties:
                object:
                  const: whatsapp_business_account
                entry:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
      responses:
        '200':
          description: Durable persistence confirmed; transport retries are safe.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verification or signature rejected.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Rejected verification, signature, envelope, route, body limit or persistence. No success is returned for failed persistence.
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: getLiveness
      summary: Check process liveness
      description: Does not contact Meta, SMTP or PostgreSQL.
      tags:
        - Foundation
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check database and schema readiness
      description: Requires compatible schema and a non-owner, non-bypass runtime role.
      tags:
        - Foundation
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '413':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/csrf:
    get:
      operationId: csrf
      summary: csrf
      tags:
        - Identity
      security: []
      description: Return/initiate the same-origin CSRF cookie and readable token.
      x-permission: Public proof/throttling or CSRF bootstrap
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: public_login
      summary: public login
      tags:
        - Identity
      security: []
      description: >-
        Generic authentication failure. Successful password authentication returns a rotated session or a bounded MFA
        challenge.
      x-permission: Public proof/throttling or CSRF bootstrap
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 256
                  writeOnly: true
                code:
                  type: string
                  writeOnly: true
                token:
                  type: string
                  writeOnly: true
                name:
                  type: string
                  maxLength: 100
                organization_id:
                  type: string
                  format: uuid
                member_id:
                  type: string
                  format: uuid
                role_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                permissions:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    enum:
                      - organization.view
                      - members.view
                      - members.invite
                      - members.manage
                      - teams.view
                      - teams.manage
                      - roles.view
                      - roles.manage
                      - roles.assign
                      - owners.manage
                      - audit.view
                scope:
                  type: string
                  enum:
                    - ORG
                    - TEAM
                    - SELF
                team_id:
                  anyOf:
                    - type: string
                      format: uuid
                    - type: 'null'
              required:
                - email
                - password
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: logout
      tags:
        - Identity
      security:
        - SessionCookie: []
      description: Revoke current session and expire its cookie.
      x-permission: Authenticated self
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
                code:
                  type: string
                  writeOnly: true
                token:
                  type: string
                  writeOnly: true
                name:
                  type: string
                  maxLength: 100
                organization_id:
                  type: string
                  format: uuid
                member_id:
                  type: string
                  format: uuid
                role_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                permissions:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    enum:
                      - organization.view
                      - members.view
                      - members.invite
                      - members.manage
                      - teams.view
                      - teams.manage
                      - roles.view
                      - roles.manage
                      - roles.assign
                      - owners.manage
                      - audit.view
                scope:
                  type: string
                  enum:
                    - ORG
                    - TEAM
                    - SELF
                team_id:
                  anyOf:
                    - type: string
                      format: uuid
                    - type: 'null'
              required: []
  /api/v1/auth/session:
    get:
      operationId: session
      summary: session
      tags:
        - Identity
      security:
        - SessionCookie: []
      description: Return current nonsecret identity metadata and active organization memberships.
      x-permission: Authenticated self
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mfa/verify:
    post:
      operationId: public_mfa
      summary: public mfa
      tags:
        - Identity
      security: []
      description: Consume an MFA login challenge after one-use TOTP/recovery-code validation; establish a rotated session.
      x-permission: Public proof/throttling or CSRF bootstrap
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
                code:
                  type: string
                  writeOnly: true
                token:
                  type: string
                  writeOnly: true
                name:
                  type: string
                  maxLength: 100
                organization_id:
                  type: string
                  format: uuid
                member_id:
                  type: string
                  format: uuid
                role_ids:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                permissions:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    enum:
                      - organization.view
                      - members.view
                      - members.invite
                      - members.manage
                      - teams.view
                      - teams.manage
                      - roles.view
                      - roles.manage
