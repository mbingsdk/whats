                type: string
              name:
                type: string
              display_number:
                type: string
              quality:
                type: string
              platform:
                type: string
              code_verification_status:
                type: string
              lifecycle:
                type: string
              graph_version:
                type: string
              synced_at:
                type: string
                format: date-time
    MetaProfile:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          format: uuid
        items:
          type: array
